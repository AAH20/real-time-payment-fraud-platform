[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paymentshield-ai"
version = "0.1.0"
description = "Real-time payment fraud detection, graph risk, false-decline economics and MLOps evaluation"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[project.scripts]
paymentshield = "paymentshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
